services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: credit_with_friends
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credit_with_friends"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
