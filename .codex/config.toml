#:schema https://developers.openai.com/codex/config-schema.json

# Forge-managed team model routing is committed here and in agents/*.toml.
# The user and host select the main coordinator model and reasoning.
# Terse output: artifacts and diffs carry the substance, not prose.
model_verbosity = "low"
model_reasoning_summary = "concise"
personality = "pragmatic"
# Forge runs Codex with full access and no approval prompts; forge sync and forge upgrade keep it so.
sandbox_mode = "danger-full-access"
approval_policy = "never"
web_search = "cached"

[features]
hooks = true
multi_agent = true

[agents]
max_concurrent_threads_per_session = 6
max_depth = 1

[agents.architect]
config_file = "agents/architect.toml"
description = "Weighs design choices against the repo's decisions and standards."

[agents.coder]
config_file = "agents/coder.toml"
description = "Builds server-side APIs, data and business logic for a bounded task."

[agents.debugger]
config_file = "agents/debugger.toml"
description = "Finds the root cause of a hard failure."

[agents.explorer]
config_file = "agents/explorer.toml"
description = "Explores the codebase and traces dependencies without changing files."

[agents.frontend]
config_file = "agents/frontend.toml"
description = "Builds frontend screens and interaction for a bounded task."

[agents.griller]
config_file = "agents/griller.toml"
description = "Use for independent read-only plan and handover grilling."

[agents.lite]
config_file = "agents/lite.toml"
description = "Use only for formal Symphony Forge Lite fixes."

[agents.performance]
config_file = "agents/performance.toml"
description = "Measures performance problems and finds the smallest fix."

[agents.planner]
config_file = "agents/planner.toml"
description = "Turns an approved story into bounded tasks with their tests."

[agents.refactorer]
config_file = "agents/refactorer.toml"
description = "Makes behaviour-preserving refactors for a bounded task."

[agents.security]
config_file = "agents/security.toml"
description = "Checks trust boundaries, validation, permissions and secrets."

[agents.tester]
config_file = "agents/tester.toml"
description = "Writes and fixes automated tests for a bounded task."

[agents.worker]
config_file = "agents/worker.toml"
description = "Builds a bounded Forge task or fix end to end."

[agents.planner-high]
config_file = "agents/planner-high.toml"
description = "Use for repository-grounded implementation planning."

[agents.docs-decomposer]
config_file = "agents/docs-decomposer.toml"
description = "Use for bounded decomposition from approved plans."

[agents.functional-checker]
config_file = "agents/functional-checker.toml"
description = "Use for user-visible functional verification."

[projects."/workspace"]
trust_level = "trusted"

[agents.fixer]
config_file = "agents/fixer.toml"
description = "Builds a bounded Forge fix end to end."

[agents.reader]
config_file = "agents/reader.toml"
description = "Cold reads a plan for blocking defects without changing files."
