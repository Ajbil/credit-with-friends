# Forge's settings. Your coding agent keeps this file: ask it to change a setting or upgrade Forge.
version = "v1.1.0"
repo = "client"
signoff = "docs/decisions/0010-client-signoff.md"
workers = "codex"
test = "[ ! -f package.json ] || (npm ci && npm test)"
checks = ["tests", "forge-pr-check"]
interfaces = ["**/routes/**", "**/*.controller.*", "**/migrations/**", "**/schema.*", "**/*.schema.*", "**/cli.*"]

[models.build]
model = "gpt-6-sol"
effort = "medium"

[models.fix]
model = "gpt-6-sol"
effort = "medium"

[models.lite]
model = "gpt-6-sol"
effort = "medium"

[models.grill.codex]
model = "gpt-6-sol"
effort = "high"

[models.grill.claude]
model = "opus"
effort = "high"

[models.review]
model = "gpt-6-astra"
