# Forge's settings. Your coding agent keeps this file: ask it to change a setting or upgrade Forge.
version = "v1.2.19"
repo = "client"
signoff = "docs/decisions/0010-client-signoff.md"
workers = "codex"
test = "(command -v pnpm >/dev/null 2>&1 || corepack enable) && pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm exec vitest run --project api-unit && pnpm build"
checks = ["tests", "forge-pr-check", "checks"]
interfaces = ["apps/api/**/routes/**", "**/*.controller.*", "**/migrations/**", "**/schema.*", "**/*.schema.*", "**/cli.*"]

[models.build]
model = "gpt-6-sol"
effort = "medium"

[models.fix]
model = "gpt-6-sol"
effort = "medium"

[models.lite]
model = "gpt-6-sol"
effort = "medium"

[models.grill.codex]
model = "gpt-6-sol"
effort = "high"

[models.grill.claude]
model = "opus"
effort = "high"

[models.review]
model = "gpt-6-sol"
effort = "high"
